<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajarr Javascript</title>
</head>
<body>
    <h1>Belajar Javascript</h1>
    <p id="demo">Hello</p>
    <button onclick="alert('Hello')">KLIK</button>

    <script>
        document.getElementById ("demo").innerHTML = 'Text Hello diubah menjadi Selamat Datang';



        document.getElementById("demo").style.color = "green";

        console.log("Pesan inii dapat dilihat di console browser");
    </script>
</body>
